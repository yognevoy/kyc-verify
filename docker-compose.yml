services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_DIR: /uploads
      PROVIDER_MIN_DELAY: ${PROVIDER_MIN_DELAY:-500ms}
      PROVIDER_MAX_DELAY: ${PROVIDER_MAX_DELAY:-3s}
      PROVIDER_APPROVE_CHANCE: ${PROVIDER_APPROVE_CHANCE:-0.8}
      PROVIDER_FAILURE_CHANCE: ${PROVIDER_FAILURE_CHANCE:-0}
      PROVIDER_RATE_LIMIT_RPS: ${PROVIDER_RATE_LIMIT_RPS:-5}
      PROVIDER_RATE_LIMIT_BURST: ${PROVIDER_RATE_LIMIT_BURST:-10}
      PROVIDER_CB_FAILURE_THRESHOLD: ${PROVIDER_CB_FAILURE_THRESHOLD:-3}
      PROVIDER_CB_COOLDOWN: ${PROVIDER_CB_COOLDOWN:-15s}
      PROVIDER_URL: ${PROVIDER_URL:-}
      PROVIDER_WEBHOOK_SECRET: ${PROVIDER_WEBHOOK_SECRET:-}
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - uploads_data:/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
