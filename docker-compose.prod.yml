services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  backend:
    ports: !reset []
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports: !override
      - "${FRONTEND_PORT:-80}:80"
    volumes: !reset []
    environment: !reset {}
    depends_on: !override
      backend:
        condition: service_healthy
